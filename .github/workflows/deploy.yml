name: Deploy to InfinityFree

on:
  push:
    branches:
      - Hiep-3
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub khi cần

jobs:
  web-deploy:
    name: 🎉 Deploy to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Lấy mã nguồn mới nhất
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Đồng bộ file lên InfinityFree qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            Database/**
            tests/**
            scripts/**
            *.zip
            *.md
            .env*
            .DS_Store
            **/.DS_Store
